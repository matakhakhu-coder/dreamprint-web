<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />

    <!-- Google Fonts — preconnect first, then stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- SEO defaults (SEOEngine.applyMeta() overwrites these at runtime) -->
    <title>DreamPrint SA — Custom Children's Artwork on Premium Products</title>
    <meta name="description" content="Turn your child's art into something they'll wear forever. Custom-printed keepsakes from children's drawings — SA-made, delivered nationwide." />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />

    <!-- Open Graph -->
    <meta property="og:type"  content="website" />
    <meta property="og:title" content="DreamPrint SA — Custom Children's Artwork on Premium Products" />
    <meta property="og:description" content="Turn your child's art into something they'll wear forever." />
    <meta property="og:locale" content="en_ZA" />
  </head>
  <body class="bg-dp-cream font-body text-dp-navy antialiased">

    <!-- Customer-facing app shell -->
    <div id="app"></div>

    <!-- Admin dashboard shell — rendered only on /admin route -->
    <div id="admin" class="hidden"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
